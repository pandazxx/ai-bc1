name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: make test

  build-webgl:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Verify Emscripten
        run: |
          emcc --version
          echo "EMSDK=$EMSDK"
          which emcc

      - name: Build Raylib for web
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git /tmp/raylib
          cd /tmp/raylib/src
          emcc -c rcore.c -Os -Wall -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2
          emcc -c rshapes.c -Os -Wall -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2
          emcc -c rtextures.c -Os -Wall -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2
          emcc -c rtext.c -Os -Wall -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2
          emcc -c rmodels.c -Os -Wall -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2
          emcc -c utils.c -Os -Wall -DPLATFORM_WEB
          emcc -c raudio.c -Os -Wall -DPLATFORM_WEB
          emar rcs libraylib.a rcore.o rshapes.o rtextures.o rtext.o rmodels.o utils.o raudio.o
          echo "Raylib built successfully"
          ls -la libraylib.a

      - name: Build WebGL package
        run: |
          mkdir -p build/webgl
          emcc main.c -o build/webgl/index.html \
            -I/tmp/raylib/src \
            -L/tmp/raylib/src \
            -Os -Wall \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s TOTAL_MEMORY=67108864 \
            -s GL_ENABLE_GET_PROC_ADDRESS \
            -DPLATFORM_WEB \
            -lraylib
          echo "WebGL build complete"
          ls -la build/webgl/

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/webgl/

  deploy:
    runs-on: ubuntu-latest
    needs: build-webgl
    if: startsWith(github.ref, 'refs/tags/release/')
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build/webgl/

      - name: Configure AWS credentials
        if: env.S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync WebGL build to S3
        if: env.S3_BUCKET != ''
        run: |
          TAG_FOLDER="${GITHUB_REF#refs/tags/release/}"
          aws s3 sync build/webgl "s3://${S3_BUCKET}/${TAG_FOLDER}/"
